name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: ./build.sh "${GITHUB_REF_NAME#v}"

      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent AppMixer.app "AppMixer-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "AppMixer-${GITHUB_REF_NAME}.zip" > "AppMixer-${GITHUB_REF_NAME}.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.zip build/*.sha256 \
            --title "AppMixer ${GITHUB_REF_NAME}" \
            --generate-notes
